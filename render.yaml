databases:
  - name: acme-salary-db
    plan: free
    databaseName: acme_salary
    user: acme_salary

services:
  - type: web
    name: acme-salary-api
    runtime: python
    plan: free
    rootDir: server
    # Free-tier Render has no one-off Jobs API, so the initial 10k-employee seed rides
    # along in the build step - guarded so redeploys never reseed on top of real data.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py shell -c "from django.core.management import call_command; from salaries.models import Employee; call_command('seed_employees') if not Employee.objects.exists() else print('already seeded, skipping')"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
